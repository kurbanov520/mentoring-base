<div class="div-form-general">
    <div class="div-form-general-two">
        <form class="div-form" [formGroup]="form" (ngSubmit)="submitForm()">
            <p>TITLE: </p>
            <input type="text" formControlName="title">
            <p>BODY: </p>
            <input type="text" formControlName="body">
            <button class="button" [disabled]="form.invalid">CREATE USER</button>
        </form>
    </div>
</div>
