<div style="width: 200px; height: 250px; border: 1px solid black; margin: 10px; padding: 10px;">
    <p>ТЕКСТ ЗАДАЧИ</p>
    <div>
        {{$any(todo).title}}
    </div>

    <p>АВТОР ЗАДАЧИ</p>
    <div>{{$any(todo).userId}}</div>

    <p>ЗАДАЧА ЗАВЕРШЕНА</p>
    <div>{{$any(todo).completed ? 'ДА' : 'НЕТ'}}</div>
    <button (click)=onDeleteTodo(todo.id)>УДАЛИТЬ ЗАДАЧУ</button>
</div>
