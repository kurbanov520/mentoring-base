<div style="width: 250px; height: 330px; border: 1px solid black; margin: 10px; padding: 10px; ">
    <p>ПРОСТО ТЕКСТ</p>
    <div>
        {{todo.id}}
    </div>
    <p>ТЕКСТ ЗАДАЧИ</p>
    <div>
        {{todo.title}}
    </div>

    <p>АВТОР ЗАДАЧИ</p>
    <div>{{todo.userId}}</div>

    <p>ЗАДАЧА ЗАВЕРШЕНА!</p>

    <div>{{todo.completed ? 'ДА': 'НЕТ'}}</div>
    <button (click)="onDeleteTodo(todo.id)">УДАЛИТЬ ЗАДАЧУ</button>
</div>
