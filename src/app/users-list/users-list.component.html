<div style="width: 1320px; margin: 0 auto;">
    <app-create-user (createUser)="createUser($event)"></app-create-user>
    <div style="display: flex; flex-wrap: wrap;">
        <div *ngFor="let item of usersService.users$ | async">
            <app-user-card [user]="item" (deleteUserOne)="deleteUser($event)" (editUser)="editUser($event)"></app-user-card>
        </div>
    </div>
</div>
